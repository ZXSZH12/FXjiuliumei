<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>福賀くるみ - AUDJPY,H1 - Kurumi Trader</title>
<style>
/* ============ 经典 Windows / MT4 浅色主题 ============ */
:root{
  --face:#f0f0f0;          /* 窗口灰 */
  --face2:#e9e9e9;
  --line:#cfcfcf;
  --line-d:#b9b9b9;
  --txt:#1a1a1a;
  --txt2:#4a4a4a;
  --blue:#3b3b9d;          /* 一键下单靛蓝 */
  --blue2:#4a4ab4;
  --up:#e14b4b;            /* 阳线 红 */
  --dn:#4aa8e0;            /* 阴线 蓝 */
  --sel:#cfe3fa;           /* 菜单/行高亮 */
  --ui:Tahoma,"MS UI Gothic","Meiryo UI","Yu Gothic UI","Segoe UI","Microsoft YaHei",sans-serif;
  --num:Tahoma,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--txt);
  background:#e9e3da;
  font:12px var(--ui);
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:var(--ui);font-size:11px;color:var(--txt)}
button{cursor:pointer}
::-webkit-scrollbar{width:15px;height:15px}
::-webkit-scrollbar-track{background:#f0f0f0}
::-webkit-scrollbar-thumb{background:linear-gradient(#fbfbfb,#e2e2e2);border:1px solid #b5b5b5;border-radius:0}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(#f0f8ff,#cfe3fa)}

/* ============ 桌面 ============ */
.desk{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.wall{position:absolute;inset:0;background:#ffffff}

/* ============ 窗口 ============ */
.app{
  position:absolute;left:28px;top:22px;width:calc(100vw - 56px);height:calc(100vh - 64px);
  z-index:10;display:flex;flex-direction:column;overflow:hidden;
  background:var(--face);border:1px solid #6f8fb5;border-radius:5px 5px 0 0;
  box-shadow:0 12px 40px rgba(30,50,90,.28),0 0 0 1px rgba(255,255,255,.6) inset;
}
.app.maxed{left:0;top:0;width:100vw;height:calc(100vh - 42px);border-radius:0}
.app.mini{display:none}

/* 标题栏 */
.tbar{
  flex:0 0 27px;display:flex;align-items:center;gap:7px;padding:0 0 0 7px;
  background:linear-gradient(180deg,#f7fbff 0%,#e4eefa 40%,#d3e3f6 100%);
  border-bottom:1px solid #9db8d6;user-select:none;
}
.tbar .ico{width:16px;height:16px;border-radius:2px;background:linear-gradient(140deg,#5b7fb4,#2b4a78);
  display:grid;place-items:center;color:#fff;font:700 9px var(--num)}
.tbar .ttl{font:11px var(--ui);color:#16324f;text-shadow:0 1px 0 #fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caps{display:flex;height:100%}
.caps button{width:32px;height:100%;display:grid;place-items:center;border-left:1px solid #c2d6ea;color:#22405f}
.caps button:hover{background:linear-gradient(#eaf4ff,#c7ddf6)}
.caps .x:hover{background:#d63b2f;color:#fff;border-left-color:#b5322a}
.caps svg{width:9px;height:9px}
.langbtn{height:18px;padding:0 7px;margin-right:6px;border:1px solid #94b3d3;border-radius:3px;
  background:linear-gradient(#fff,#e6f0fb);font:10px var(--ui);color:#1b3a5c;white-space:nowrap}
.langbtn:hover{background:linear-gradient(#fff,#d3e6fb)}

/* 菜单栏 */
.mbar{flex:0 0 22px;display:flex;align-items:stretch;background:var(--face);border-bottom:1px solid #dcdcdc;position:relative;z-index:60}
.mnu{position:relative;display:flex;align-items:stretch}
.mnu>button{border:none;background:transparent;padding:0 10px;font:11.5px var(--ui);color:#111}
.mnu:hover>button,.mnu.open>button{background:#cde3fa;box-shadow:inset 0 0 0 1px #9ec6ea}
.dropdown{position:absolute;top:100%;left:0;min-width:190px;padding:2px;display:none;z-index:80;
  background:#f6f6f6;border:1px solid #a0a0a0;box-shadow:2px 2px 6px rgba(0,0,0,.28)}
.mnu.open .dropdown{display:block}
.mi{display:flex;justify-content:space-between;gap:24px;padding:3px 20px 3px 22px;font:12px var(--ui);color:#111;white-space:nowrap;position:relative}
.mi:hover{background:#cde3fa}
.mi.on::before{content:"✓";position:absolute;left:6px}
.mi .kb{color:#7a7a7a;font:10px var(--ui)}
.msep{height:1px;background:#d2d2d2;margin:3px 4px}

/* 工具栏 */
.tb{flex:0 0 27px;display:flex;align-items:center;gap:1px;padding:0 3px;
  background:linear-gradient(#fdfdfd,#f2f2f2 55%,#e8e8e8);border-bottom:1px solid #d2d2d2}
.tbi{width:23px;height:21px;display:grid;place-items:center;border:1px solid transparent;border-radius:2px;padding:0}
.tbi:hover{background:linear-gradient(#fff,#dcebfb);border-color:#8fb6dd}
.tbi:active{background:linear-gradient(#cfe2f6,#eaf3fd)}
.tbi svg{width:16px;height:16px;display:block}
.tbi.wide{width:auto;padding:0 7px;display:flex;align-items:center;justify-content:center;gap:5px;font:11px var(--ui);white-space:nowrap}
.tbi.on{background:linear-gradient(#e2edfa,#cfe2f6);border-color:#8fb6dd}
.sep{width:2px;height:18px;margin:0 3px;border-left:1px solid #c4c4c4;border-right:1px solid #fff}
.tb .grow{flex:1}
.tfbtn{height:19px;min-width:26px;padding:0 4px;border:1px solid transparent;border-radius:2px;
  font:11px var(--num);color:#222;background:transparent}
.tfbtn:hover{background:linear-gradient(#fff,#e4effb);border-color:#a8c8e6}
.tfbtn.on{border-color:#9a9a9a;background:linear-gradient(#fdfdfd,#ececec);box-shadow:inset 0 1px 2px rgba(0,0,0,.10)}

/* ============ 工作区 ============ */
.work{flex:1;min-height:0;display:flex;background:#fff}

/* 気配値（Market Watch）*/
.mw{width:196px;flex:0 0 196px;display:flex;flex-direction:column;background:#f7f7f7;border-right:1px solid #c8c8c8;min-height:0}
.mw.hide{display:none}
.mw-head{height:20px;display:flex;align-items:center;padding:0 6px;font:11px var(--ui);
  background:linear-gradient(#fafafa,#ebebeb);border-bottom:1px solid #d3d3d3;color:#333}
.mw-tb{display:grid;grid-template-columns:1fr 62px 62px;font:10px var(--ui);color:#555;
  background:#f0f0f0;border-bottom:1px solid #dcdcdc}
.mw-tb span{padding:2px 5px;border-right:1px solid #e2e2e2}
.mw-tb span:last-child{border-right:none}
.mw-list{flex:1;overflow:auto;background:#fff}
.mw-row{display:grid;grid-template-columns:1fr 62px 62px;font:11px var(--num);cursor:default;border-bottom:1px solid #f2f2f2}
.mw-row span{padding:2px 5px;white-space:nowrap;overflow:hidden}
.mw-row .sym{font-family:var(--ui);color:#222}
.mw-row:hover{background:#eaf3ff}
.mw-row.sel{background:#3874d8;color:#fff}
.mw-row.sel .sym{color:#fff}
.bid{color:#c0392b;text-align:right;border-left:1px solid #f0f0f0}
.ask{color:#1f6fb2;text-align:right;border-left:1px solid #f0f0f0}
.mw-row.sel .bid,.mw-row.sel .ask{color:#fff}
.mw-foot{border-top:1px solid #d3d3d3;padding:3px 5px;font:10px var(--ui);color:#555;display:flex;justify-content:space-between;background:#f0f0f0}

/* 图表 */
.chartbox{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:#fff}
.chart-top{flex:1;position:relative;min-height:0}
#chart{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.symtab{position:absolute;left:3px;top:3px;z-index:3;display:flex;align-items:center;gap:4px;
  padding:1px 7px 2px;background:#f2f2f2;border:1px solid #b9b9b9;font:11px var(--ui);color:#222;user-select:none}
.symtab .tri{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #444}
.symtab:hover{background:#e8f1fb}
.hscroll{flex:0 0 16px;background:#f0f0f0;border-top:1px solid #cfcfcf;position:relative}
.hscroll .thumb{position:absolute;top:1px;height:13px;left:0;width:38%;
  background:linear-gradient(#fbfbfb,#e4e4e4);border:1px solid #b3b3b3;border-radius:2px}
.hscroll .corner{position:absolute;right:0;top:0;width:16px;height:100%;border-left:1px solid #cfcfcf;background:#eee}

/* 一键下单面板（参考图核心元素）*/
.oneclick{position:absolute;left:3px;top:24px;z-index:5;width:290px;font-family:var(--ui);
  box-shadow:0 1px 3px rgba(0,0,0,.28);user-select:none;
  --blue:#2f2bb8;--blue2:#4543cc;
  background:linear-gradient(180deg,#3835c2,#26219f);transition:background .16s linear}
.oneclick.down{--blue:#ce3a34;--blue2:#e05a4f;background:linear-gradient(180deg,#d63c3c,#a52a2e)}
.oneclick.down .oc-vol{border-left-color:#c98c8c;border-right-color:#c98c8c}
.oneclick.down .oc-cell+.oc-cell{border-left-color:#d88a86}
.oc-top{display:flex;height:26px}
.oc-tab{flex:0 0 96px;background:var(--blue);color:#fff;font:11px var(--ui);letter-spacing:.04em;
  display:grid;place-items:center;cursor:pointer;border-top:1px solid #5a5ac0}
.oc-tab:hover{background:var(--blue2)}
.oc-tab:active{background:#2e2e86}
.oc-vol{flex:1;display:flex;align-items:center;background:#f2f2f3;border-left:1px solid #8d8da8;border-right:1px solid #8d8da8}
.oc-step{width:17px;height:100%;display:grid;place-items:center;cursor:pointer;color:#333;font-size:6px;background:transparent}
.oc-step:hover{background:#dbeafb;color:#000}
.oc-num{flex:1;text-align:center;font:11px var(--num);color:#111}
.oc-bot{display:flex;height:40px;background:var(--blue)}
.oc-cell{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;position:relative;padding-bottom:3px}
.oc-cell:hover{background:var(--blue2)}
.oc-cell:active{background:#2e2e86}
.oc-cell+.oc-cell{border-left:1px solid #6e6ec6}
.oc-int{font:400 14px var(--num);opacity:.95;margin-top:7px}
.oc-big{font:600 27px/1 var(--num);letter-spacing:.5px}
.oc-sup{font:400 10px var(--num);align-self:flex-start;margin-top:8px;margin-left:1px}

/* ============ 口座を選択ダイアログ ============ */
.adlg{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:508px;background:#f0f0f0;
  border:1px solid #6f6f6f;box-shadow:0 8px 26px rgba(0,0,0,.34);font-family:var(--ui);color:#1b1b1b}
.ad-t{height:27px;display:flex;align-items:center;gap:4px;padding:0 4px 0 9px;
  background:linear-gradient(#fdfefe,#eef3f8);border-bottom:1px solid #b9c3cd;font-size:11.5px;color:#243b52}
.ad-t .sp{flex:1}
.ad-t button{width:22px;height:19px;border:1px solid #c3ccd5;background:linear-gradient(#fff,#eef2f6);
  color:#39536b;font:11px/1 var(--ui);display:grid;place-items:center;padding:0}
.ad-t button:hover{background:#dfeaf7;border-color:#8fb3d6}
.ad-body{padding:14px 12px 10px}
.ad-lead{font-size:12px;margin:0 0 12px 4px}
.ad-box{border:1px solid #b6b6b6;background:#fff;padding:8px}
.ad-search{display:flex;gap:8px;margin-bottom:7px}
.ad-search input{flex:1;height:21px;border:1px solid #b6c0ca;padding:0 5px;font:11.5px var(--ui);color:#333;outline:none}
.ad-search input:focus{border-color:#7fa8d0}
.ad-search button{width:96px;height:21px;border:1px solid #b6c0ca;background:linear-gradient(#fff,#eceff3);
  font:11.5px var(--ui);color:#2b3f52}
.ad-search button:hover{background:linear-gradient(#fff,#dfe9f5)}
.ad-list{border:1px solid #c9d2da;background:#fff;height:98px;overflow:auto}
.ad-row{display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;font-size:12px;cursor:default}
.ad-row:hover{background:#eaf3fc}
.ad-row.on,.ad-row.on:hover{background:#3594e5;color:#fff}
.ad-row .av{width:17px;height:17px;border-radius:2px;flex:0 0 17px;display:grid;place-items:center;
  background:#1b2b63;color:#ffd34d;font:700 7px var(--num)}
.ad-row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-row .no{font-family:var(--num);color:#1a4fa0;text-decoration:underline}
.ad-row.on .no{color:#fff}
.ad-empty{height:26px;display:grid;place-items:center;color:#9aa3ad;font-size:11.5px}
.ad-foot{display:flex;justify-content:flex-end;gap:10px;padding:9px 14px 12px;border-top:1px solid #d5dbe1;background:#e9edf2}
.ad-foot button{min-width:92px;height:23px;border:1px solid #9fb0c0;background:linear-gradient(#fff,#e6ebf1);
  font:11.5px var(--ui);color:#22374b;box-shadow:inset 0 1px 0 #fff}
.ad-foot button:hover{background:linear-gradient(#fff,#d7e4f2)}
.ad-foot button.primary{border-color:#7fa5c9;background:linear-gradient(#fff,#dceaf8)}
.ad-foot button.primary:hover{background:linear-gradient(#fff,#c6dcf2)}

/* ============ 终端（底部）============ */
.term{flex:0 0 158px;display:flex;flex-direction:column;background:#f5f5f5;border-top:1px solid #a8a8a8;min-height:0}
.term.small{flex-basis:26px}
.term-tabs{flex:0 0 23px;display:flex;align-items:flex-end;gap:1px;padding:0 4px;background:#ededed;border-bottom:1px solid #bdbdbd}
.ttab{height:20px;padding:0 10px;display:flex;align-items:center;gap:5px;font:11px var(--ui);color:#333;
  background:#e3e3e3;border:1px solid #c3c3c3;border-bottom:none;border-radius:3px 3px 0 0}
.ttab:hover{background:#eef4fc}
.ttab.on{background:#fff;color:#000;height:22px;margin-bottom:-1px;border-color:#b3b3b3}
.ttab .c{font:9px var(--num);color:#666;background:#dcdcdc;border-radius:6px;padding:0 4px}
.term-body{flex:1;min-height:0;overflow:auto;background:#fff}
.term.small .term-body{display:none}
table.mt{width:100%;border-collapse:collapse;font:11px var(--num)}
table.mt th{position:sticky;top:0;z-index:2;background:linear-gradient(#fcfcfc,#ececec);color:#333;
  font:11px var(--ui);font-weight:400;text-align:right;padding:2px 8px;border-bottom:1px solid #cfcfcf;
  border-right:1px solid #e6e6e6;white-space:nowrap}
table.mt th:first-child,table.mt td:first-child{text-align:left}
table.mt td{padding:2px 8px;text-align:right;border-bottom:1px solid #f1f1f1;border-right:1px solid #f6f6f6;white-space:nowrap;color:#111}
table.mt td.txt{font-family:var(--ui)}
table.mt tbody tr:hover{background:#eaf3ff}
table.mt tbody tr.sel{background:#3874d8;color:#fff}
table.mt tbody tr.sel td{color:#fff}
.pos{color:#1a7f37}.neg{color:#c0392b}
.empty{padding:18px;text-align:center;color:#888;font:11px var(--ui)}
.term-foot{flex:0 0 24px;display:flex;align-items:center;gap:26px;padding:0 10px;font:12.5px var(--ui);
  color:#3d3d3d;border-top:1px solid #6e6e6e;
  background:linear-gradient(180deg,#9a9a9a,#8b8b8b 55%,#858585);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.12)}
.term-foot span{color:#333;text-shadow:0 1px 0 rgba(255,255,255,.18)}
.term-foot b{font-family:var(--num);font-weight:400;color:#232323;font-size:13px}
.term-foot b.warn{color:#8c1d12}
.term-foot b.ok{color:#123c1c}
.jrnl{font:11px var(--num);padding:3px 8px;color:#222;white-space:pre}
.jrnl div{padding:1px 0;border-bottom:1px solid #f6f6f6}
.jrnl .t{color:#666;margin-right:6px}

/* 状态栏 */
.sbar{flex:0 0 21px;display:flex;align-items:center;gap:0;background:var(--face);border-top:1px solid #dcdcdc;font:11px var(--ui);color:#333}
.sbar .cell{padding:0 8px;height:100%;display:flex;align-items:center;gap:5px;border-right:1px solid #dcdcdc;white-space:nowrap}
.sbar .cell.grow{flex:1;border-right:none}
.sbar .bars{display:inline-flex;align-items:flex-end;gap:1px;height:9px}
.sbar .bars i{width:2px;background:#1a7f37;display:block}
.sbar b{font-family:var(--num);font-weight:400;color:#111}

/* ============ 对话框（MT4 风格）============ */
.mask{position:absolute;inset:0;z-index:200;background:rgba(120,140,170,.25);display:none}
.mask.on{display:block}
.dlg{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:392px;
  background:#ececec;border:1px solid #9aa8b8;border-radius:6px;
  box-shadow:0 14px 44px rgba(20,40,70,.34),0 0 0 1px rgba(255,255,255,.7) inset;font:12px var(--ui)}
.dlg-head{height:25px;border-radius:5px 5px 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 8px;
  background:linear-gradient(#f7fbff,#dbe9f8);border-bottom:1px solid #a9c3e0;font:11px var(--ui);color:#16324f}
.dlg-head button{width:26px;height:18px;border:1px solid transparent;color:#22405f}
.dlg-head button:hover{background:#d63b2f;color:#fff}
.dlg-body{padding:12px 14px 8px}
.ogrid{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:7px 8px;margin-bottom:7px}
.ogrid>span{text-align:right;color:#2b2b2b;font-size:11.5px}
.ogrid .note{grid-column:2;font-size:10.5px;color:#555;margin-top:-2px}
.grayinp{height:22px;background:#c6c6c6;border:1px solid #8f8f8f;padding:1px 6px;font:11.5px var(--num);color:#1c1c1c;
  display:flex;align-items:center;justify-content:space-between;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.grayinp .car{color:#555;font-size:9px}
.symsel{width:100%;height:22px;background:#c6c6c6;border:1px solid #8f8f8f;font:11.5px var(--ui);color:#1c1c1c;
  padding:0 4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);appearance:auto}
.ogrid>div{text-align:left}
.slrow{display:flex;align-items:center;gap:5px;min-width:0}
.slrow .lbl{color:#2b2b2b;font-size:11px;white-space:nowrap;flex:0 0 auto}
.slrow .sinp{flex:0 1 76px;min-width:48px;height:22px;background:#fff;border:1px solid #8f8f8f;padding:1px 5px;font:11.5px var(--num);text-align:right}
.group{position:relative;border:1px solid #b4b4b4;border-radius:3px;padding:12px 12px 8px;margin-top:8px;background:#efefef}
.group .gtitle{position:absolute;left:9px;top:-8px;padding:0 4px;background:#ececec;font-size:11.5px;color:#2b2b2b}
.gprice{text-align:center;font:400 25px var(--num);color:#1e1e1e;letter-spacing:.5px;margin:6px 0 9px}
.gprice small{font-size:20px;color:#555}
.gbtns{display:flex;gap:10px;margin-bottom:8px}
.gbtn{flex:1;height:27px;font:12px var(--ui);color:#1a1a1a;border:1px solid #7a7a7a;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 1px 0 rgba(0,0,0,.06)}
.gbtn.sell{background:linear-gradient(180deg,#ee837f,#e47775)}
.gbtn.buy{background:linear-gradient(180deg,#7faddf,#6fa8dd)}
.gbtn:hover{filter:brightness(1.06)}
.gbtn:active{filter:brightness(.94)}
.gbar{height:14px;background:#c9c9c9;border:1px solid #b3b3b3;margin-bottom:7px}
.gnote{text-align:center;font-size:10.5px;color:#333;line-height:1.5}
.drow{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:8px;margin-bottom:6px}
.drow>span{color:#222;font-size:11.5px}
.dlg .inp{height:21px;border:1px solid #7f9db9;background:#fff;padding:1px 5px;font:12px var(--num);box-shadow:inset 1px 1px 1px #e2e2e2;width:100%}
.dlg select.inp{font-family:var(--ui);font-size:11.5px}
.dlg .inp:disabled{background:#f0f0f0;color:#777}
.dlg-foot{display:flex;justify-content:flex-end;gap:7px;padding:4px 12px 12px}
.dlg-foot:empty{display:none}
.btn{height:23px;padding:0 16px;min-width:78px;border:1px solid #8e9db3;border-radius:3px;
  background:linear-gradient(#fdfefe,#eef1f5 55%,#e2e7ee);font:11.5px var(--ui);color:#1a1a1a;
  box-shadow:inset 0 1px 0 #fff}
.btn:hover{background:linear-gradient(#fff,#dcebfb);border-color:#7aa8d8}
.btn.pri{background:linear-gradient(#fdfefe,#dbe9f8 55%,#cddff4);border-color:#7aa8d8;font-weight:600}
.btn.def{outline:1px solid #9ec6ea;outline-offset:-3px}
.dinfo{background:#fff;border:1px solid #c9c9c9;padding:6px 8px;font:11px var(--num);margin-top:4px}
.dinfo div{display:flex;justify-content:space-between;padding:1px 0}
.dinfo span{color:#555;font-family:var(--ui)}

/* ============ 水印 ============ */
.wm{position:fixed;right:14px;bottom:52px;z-index:4000;pointer-events:none;user-select:none;
  color:#ffffff;opacity:.55;font:12px var(--ui);letter-spacing:.3px;text-shadow:0 1px 2px rgba(30,50,80,.22)}

/* ============ 任务栏 ============ */
.taskbar{position:absolute;left:0;right:0;bottom:0;height:42px;z-index:5000;display:flex;align-items:center;gap:0;
  padding:0 6px 0 2px;
  background:linear-gradient(180deg,rgba(248,251,254,.97) 0%,rgba(238,245,251,.96) 45%,rgba(226,236,246,.97) 100%);
  border-top:1px solid rgba(150,175,200,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 -4px 14px rgba(120,150,190,.10);
  backdrop-filter:blur(10px)}
/* 开始按钮：Win7 四格旗 */
.start{width:40px;height:42px;display:grid;place-items:center;border:none;background:transparent;padding:0}
.start .orb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 36% 26%,#eaf7ff 0%,#8fd0f0 24%,#3f9ed8 58%,#12649f 100%);
  box-shadow:0 1px 2px rgba(12,60,105,.45),inset 0 -2px 5px rgba(0,0,0,.18),inset 0 1px 2px rgba(255,255,255,.9)}
.start:hover .orb{filter:brightness(1.07)}
.start .orb svg{width:15px;height:15px}
/* 検索ボックス */
.tsearch{position:relative;width:186px;height:22px;margin:0 10px 0 4px;flex:0 0 186px}
.tsearch input{width:100%;height:22px;border:1px solid #a9b6c3;border-radius:2px;padding:0 22px 0 7px;
  font:11px var(--ui);color:#41556a;background:linear-gradient(180deg,#fff,#f7fafd);outline:none;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.04)}
.tsearch input:focus{border-color:#7fa8d0;background:#fff}
.tsearch input::placeholder{color:#8d9aa8}
.tsearch .mag{position:absolute;right:5px;top:4px;width:13px;height:13px;color:#7f96ab;pointer-events:none}
/* 固定アイコン */
.pinbar{display:flex;align-items:center;gap:2px;height:100%}
.pin{width:32px;height:36px;display:grid;place-items:center;border-radius:3px;border:1px solid transparent;background:transparent;padding:0}
.pin:hover{background:rgba(150,185,215,.22);border-color:rgba(140,180,215,.7)}
.pin svg{width:24px;height:24px;display:block}
.lnsep{width:1px;height:24px;background:rgba(150,175,200,.5);margin:0 5px}
/* 実行中のウィンドウ */
.run{width:36px;height:36px;display:grid;place-items:center;border-radius:3px;margin-left:4px;padding:0;
  border:1px solid rgba(120,160,200,.75);
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(214,231,248,.95));
  box-shadow:inset 0 1px 0 #fff,0 1px 1px rgba(30,70,110,.10)}
.run:hover{background:linear-gradient(180deg,#fff,#c9def5)}
.run.off{border-color:transparent;background:transparent;box-shadow:none}
.run.off:hover{background:rgba(150,185,215,.22);border-color:rgba(140,180,215,.7)}
.run .ico{width:20px;height:20px;border-radius:2px;display:grid;place-items:center;
  background:linear-gradient(140deg,#5b7fb4,#2b4a78);color:#fff;font:700 9px var(--num)}
/* 通知領域 */
.tray{margin-left:auto;display:flex;align-items:center;gap:9px;height:32px;padding:0 8px 0 12px;
  border-left:1px solid rgba(150,175,205,.30)}
.tk{height:26px;min-width:24px;display:grid;place-items:center;border-radius:3px;border:1px solid transparent;
  background:transparent;color:#5f7c97;padding:0}
.tk:hover{background:rgba(140,175,210,.22);border-color:rgba(150,185,215,.6)}
.tk svg{width:17px;height:17px;display:block}
.tk .glyph{font:400 15px var(--ui);color:#5f7c97;line-height:1}
.tk-up svg{width:11px;height:11px}
.clock{font:400 12px var(--num);color:#4f6a84;white-space:nowrap;padding-left:4px;letter-spacing:.2px}
/* ============ 开始菜单（Win10 布局 · 直角 · 浅色） ============ */
.smenu{position:fixed;left:4px;bottom:44px;width:512px;height:462px;z-index:9000;display:none;
  background:#fff;border:1px solid #8794a2;box-shadow:0 10px 28px rgba(20,40,70,.26);
  font-family:var(--ui);color:#1d1d1d;flex-direction:column}
.smenu.on{display:flex}
.sm-top{height:42px;display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid #dfe4ea;background:#f6f8fa}
.sm-ava{width:26px;height:26px;border:1px solid #9fb0c0;display:grid;place-items:center;
  font:700 12px var(--ui);color:#33556f;background:#eef3f8;flex:0 0 26px}
.sm-user{font-size:12px;color:#24384a}
.sm-body{flex:1;display:flex;min-height:0}
.sm-rail{flex:0 0 40px;background:#f4f6f8;border-right:1px solid #dfe4ea;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px}
.sm-rail .sp{flex:1}
.srail{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;color:#4a627a;padding:0}
.srail:hover{background:#e6eef7;border-color:#b9cbdd}
.srail svg{width:15px;height:15px}
.sm-list{flex:1;overflow:auto;padding:4px 0 8px;min-width:0}
.sm-head{font:11px var(--ui);color:#5b7fa6;margin:9px 12px 3px}
.sm-app{display:flex;align-items:center;gap:9px;width:100%;height:27px;padding:0 12px;border:none;background:transparent;
  font:12px var(--ui);color:#1d1d1d;text-align:left}
.sm-app:hover{background:#e8f0f9}
.sm-app .gi{width:17px;height:17px;flex:0 0 17px;display:grid;place-items:center;color:#fff;font:700 8px var(--num)}
.sm-app .sub{color:#8b98a5;font-size:10px;margin-left:auto}
.sm-tiles{flex:0 0 172px;padding:8px;display:grid;grid-template-columns:74px 74px;grid-auto-rows:74px;gap:8px;
  align-content:start;border-left:1px solid #dfe4ea;background:#fbfcfd}
.tile{border:1px solid rgba(0,0,0,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#fff;font:11px var(--ui);padding:2px;text-align:center;line-height:1.15}
.tile:hover{filter:brightness(1.08)}
.tile:active{filter:brightness(.94)}
.sm-foot{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid #dfe4ea;background:#f6f8fa}
.sm-foot .sp{flex:1}
.pwbtn{width:28px;height:24px;display:grid;place-items:center;border:1px solid transparent;background:transparent;color:#43596d}
.pwbtn:hover{background:#e6eef7;border-color:#b9cbdd}
.pwbtn svg{width:14px;height:14px}
#startBtn.on .orb{filter:brightness(1.12) saturate(1.1)}

/* ============ 仮想ブラウザ（経済ニュース） ============ */
.brw{position:fixed;left:calc(100vw - 680px);top:78px;z-index:11;width:604px;height:438px;display:none;flex-direction:column;
  background:#fff;border:1px solid #7c8b9a;box-shadow:0 12px 34px rgba(20,40,70,.28);font-family:var(--ui);color:#1d1d1d}
.brw.on{display:flex}
.brw.maxed{left:0;top:0;width:100vw;height:calc(100vh - 42px)}
.brw-t{height:25px;display:flex;align-items:center;gap:7px;padding:0 4px 0 8px;
  background:linear-gradient(#fdfefe,#eef3f8);border-bottom:1px solid #b9c3cd;font-size:11.5px;color:#20364b;cursor:move}
.brw-t .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brw-t button{width:21px;height:17px;border:1px solid #c3ccd5;background:linear-gradient(#fff,#eef2f6);color:#39536b;
  display:grid;place-items:center;font:10px/1 var(--ui);padding:0}
.brw-t button:hover{background:#dfeaf7}
.brw-bar{height:27px;display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid #d7dde3;background:#f4f7fa}
.brw-bar .nb{width:21px;height:18px;border:1px solid #b9c3cd;background:linear-gradient(#fff,#eef2f6);color:#33536e;
  display:grid;place-items:center;padding:0;font:11px var(--ui)}
.brw-bar .nb:hover{background:#dfeaf7}
.brw-bar .url{flex:1;height:18px;border:1px solid #b9c3cd;background:#fff;display:flex;align-items:center;padding:0 6px;
  font:11px var(--ui);color:#33475b;overflow:hidden;white-space:nowrap}
.brw-tabs{height:23px;display:flex;align-items:flex-end;gap:2px;padding:0 6px;background:#eceff3;border-bottom:1px solid #c9d2da}
.btab{height:19px;padding:0 12px;display:flex;align-items:center;font:11px var(--ui);color:#3c536a;background:#e2e7ec;
  border:1px solid #c2ccd6;border-bottom:none}
.btab.on{background:#fff;color:#12283b;height:21px;margin-bottom:-1px}
.brw-tick{height:21px;display:flex;align-items:center;background:#fbfcfd;border-bottom:1px solid #dde4ea;overflow:hidden;
  font:11px var(--num);color:#33475b}
.brw-tick .it{padding:0 9px;white-space:nowrap;border-right:1px solid #e3e8ee}
.brw-body{flex:1;display:flex;min-height:0}
.brw-main{flex:1;overflow:auto;padding:8px 12px}
.brw-side{flex:0 0 128px;border-left:1px solid #dfe4ea;background:#fafbfc;padding:8px;overflow:auto}
.bh{font:11px var(--ui);color:#5b7fa6;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid #e2e7ec}
.ni{padding:6px 0;border-bottom:1px dotted #dfe4ea}
.ni-h{display:flex;align-items:baseline;gap:6px;font:12px var(--ui);color:#16304a}
.ni-time{color:#7b8794;font:11px var(--num);flex:0 0 auto}
.ni-tag{font:10px var(--ui);padding:0 4px;border:1px solid #c0392b;color:#c0392b;flex:0 0 auto}
.ni-tag.calm{border-color:#4a7ab5;color:#4a7ab5}
.ni-b{font:11px var(--ui);color:#5c6b79;margin:3px 0 0;line-height:1.5}
.ni-s{font:10px var(--ui);color:#95a1ad;margin-top:3px}
.ni.fresh{background:#fffbe6}
.rt{display:flex;justify-content:space-between;padding:3px 0;font:11px var(--num);border-bottom:1px dotted #e6eaef}
.rt .up{color:#c0392b}
.rt .dn{color:#2f6fa8}
.brw-st{height:19px;display:flex;align-items:center;gap:8px;padding:0 8px;background:#f0f3f6;border-top:1px solid #d7dde3;
  font:10.5px var(--ui);color:#61707e}

/* ============ ニュース通知 ============ */
.npop{position:fixed;right:14px;bottom:50px;z-index:9500;width:302px;display:none;
  background:#fff;border:1px solid #7c8b9a;box-shadow:0 6px 20px rgba(20,40,70,.26);font-family:var(--ui)}
.npop.on{display:block}
.npop-h{height:23px;display:flex;align-items:center;gap:6px;padding:0 3px 0 8px;background:#f3f6f9;
  border-bottom:1px solid #d7dde3;font:11px var(--ui);color:#20364b}
.npop-h .tt{flex:1}
.npop-h button{width:19px;height:16px;border:none;background:transparent;color:#5b6b7a;font:11px var(--ui)}
.npop-h button:hover{background:#e3ebf4}
.npop-b{display:flex;gap:9px;padding:9px 10px 10px}
.npop-i{width:26px;height:26px;flex:0 0 26px;display:grid;place-items:center;background:#c0392b;color:#fff;font:700 10px var(--num)}
.npop-t{font:12px var(--ui);color:#16304a;line-height:1.4}
.npop-s{font:11px var(--ui);color:#6a7987;margin-top:3px}

@media (max-width:1100px){ .mw{flex-basis:168px;width:168px} .oneclick{width:224px} }
</style>
</head>
<body>
<div class="desk">
  <div class="wall"></div>

  <div class="app" id="app">
    <!-- 标题栏 -->
    <div class="tbar" id="tbar">
      <div class="ico">MT</div>
      <div class="ttl" id="winTitle">福賀くるみ - AUDJPY,H1 - Kurumi Trader</div>
      <button class="langbtn" id="langBtn" title="言語切替 / 切换语言">日本語 ⇄ 中文</button>
      <div class="caps">
        <button id="btnMin" title="最小化"><svg viewBox="0 0 9 9"><rect x="1" y="4" width="7" height="1" fill="currentColor"/></svg></button>
        <button id="btnMax" title="最大化"><svg viewBox="0 0 9 9" fill="none" stroke="currentColor"><rect x="1.2" y="1.2" width="6.6" height="6.6"/></svg></button>
        <button id="btnClose" class="x" title="閉じる"><svg viewBox="0 0 9 9" stroke="currentColor" stroke-width="1.1"><path d="M1.2 1.2l6.6 6.6M7.8 1.2L1.2 7.8"/></svg></button>
      </div>
    </div>

    <!-- 菜单栏 -->
    <div class="mbar" id="mbar"></div>

    <!-- 工具栏 1 -->
    <div class="tb" id="tb1">
      <button class="tbi" title="ワークスペース" data-i18n-title="tip.workspace">
        <svg viewBox="0 0 16 16"><rect x="1" y="3" width="9" height="7" fill="#cfe0f5" stroke="#5b7fb4"/><rect x="3" y="5" width="9" height="7" fill="#8fb6e0" stroke="#3c6699"/></svg>
      </button>
      <button class="tbi" id="btnCross" title="十字カーソル">
        <svg viewBox="0 0 16 16" fill="none" stroke="#6a5b8a"><circle cx="8" cy="8" r="5"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3"/></svg>
      </button>
      <span class="sep"></span>
      <button class="tbi" id="btnBuyArrow" title="新規買い注文" data-i18n-title="tip.buy">
        <svg viewBox="0 0 16 16"><path d="M8 2l4 5H9.6v6H6.4V7H4z" fill="#57b757" stroke="#2f7d2f"/></svg>
      </button>
      <button class="tbi" id="btnSellArrow" title="新規売り注文" data-i18n-title="tip.sell">
        <svg viewBox="0 0 16 16"><path d="M8 14L4 9h2.4V3h3.2v6H12z" fill="#e06a6a" stroke="#a83a3a"/></svg>
      </button>
      <span class="sep"></span>
      <button class="tbi" title="テンプレート">
        <svg viewBox="0 0 16 16"><path d="M1.5 3.5h4l1.2 1.6h6.8v8H1.5z" fill="#f5d76e" stroke="#b99a2a"/></svg>
      </button>
      <button class="tbi" title="ズーム">
        <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.3" fill="#dceafa" stroke="#4a6f96"/><path d="M10.2 10.2l4 4" stroke="#4a6f96" stroke-width="1.6"/></svg>
      </button>
      <button class="tbi wide" id="btnNewOrder" title="新規注文">
        <svg viewBox="0 0 16 16"><rect x="2.5" y="1.5" width="9" height="11" fill="#fff" stroke="#7a7a7a"/><path d="M4.5 4.5h5M4.5 6.5h5M4.5 8.5h3" stroke="#9a9a9a"/><circle cx="12" cy="10.5" r="3.4" fill="#e8443a"/><path d="M12 8.9v3.2M10.4 10.5h3.2" stroke="#fff" stroke-width="1.2"/></svg>
        <span data-i18n="tb.newOrder"></span>
      </button>
      <button class="tbi" id="btnAuto" title="自動売買">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6" fill="#ffe08a" stroke="#c49a1e"/><circle cx="6" cy="6.6" r=".9" fill="#7a5c00"/><circle cx="10" cy="6.6" r=".9" fill="#7a5c00"/><path d="M5.6 9.4c1.6 1.4 3.2 1.4 4.8 0" stroke="#7a5c00" fill="none" stroke-linecap="round"/></svg>
      </button>
      <span class="sep"></span>
      <button class="tbi" title="気配値" id="btnMW">
        <svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" fill="#fff" stroke="#7a7a7a"/><path d="M1.5 5.5h13" stroke="#7a7a7a"/><path d="M4 8.5h3M4 10.5h3M9 8.5h3M9 10.5h3" stroke="#9a9a9a"/></svg>
      </button>
      <button class="tbi" title="データウィンドウ">
        <svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" fill="#fff" stroke="#7a7a7a"/><path d="M4 5h8M4 8h8M4 11h5" stroke="#9a9a9a"/></svg>
      </button>
      <span class="sep"></span>
      <button class="tbi" title="フォルダ">
        <svg viewBox="0 0 16 16"><path d="M1.5 3.5h4l1.2 1.6h6.8v8H1.5z" fill="#f5d76e" stroke="#b99a2a"/></svg>

      <button class="tbi" title="データフィード">
        <svg viewBox="0 0 16 16"><path d="M3.5 11a3 3 0 010-6 4 4 0 017.6-1A2.6 2.6 0 0112.5 11z" fill="#bcd7f5" stroke="#7fa8d6"/></svg>

      <span class="sep"></span>
      <button class="tbi wide" id="btnLang2" title="言語切替"><span id="langLabel">中文</span></button>

    <!-- 工具栏 2 -->
    <div class="tb" id="tb2">
      <button class="tbi" title="縮小"><svg viewBox="0 0 16 16" stroke="#5a5a5a" stroke-width="1.6"><path d="M3 8h7"/><path d="M8.5 5.5L11 8l-2.5 2.5"/></svg></button>
      <button class="tbi" title="垂直線"><svg viewBox="0 0 16 16" stroke="#5a5a5a" stroke-width="1.6"><path d="M8 2v12"/></svg></button>
      <button class="tbi" title="水平線"><svg viewBox="0 0 16 16" stroke="#5a5a5a" stroke-width="1.6"><path d="M2 8h12"/></svg></button>
      <button class="tbi" title="トレンドライン"><svg viewBox="0 0 16 16" stroke="#5a5a5a" stroke-width="1.6"><path d="M3 13L13 3"/></svg></button>

      <button class="tbi" title="ラベル"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" fill="#fff" stroke="#9a9a9a"/><text x="4" y="12" font-family="Georgia,serif" font-size="11" fill="#3a3a3a">T</text><circle cx="12.5" cy="4.5" r="1.4" fill="#3a3a3a"/></svg></button>
      <span class="sep"></span>
      <button class="tbi" title="インジケーター"><svg viewBox="0 0 16 16"><path d="M3 13V4M6 13V7M9 13V9M12 13V6" stroke="#4a4a4a" stroke-width="1.4"/><text x="11" y="14" font-size="6" fill="#4a4a4a">E</text></svg></button>

      <button class="tbi" title="拡大"><svg viewBox="0 0 16 16"><path d="M3 6l5-3 5 3z" fill="#4a4a4a"/><path d="M3 11l5 3 5-3z" fill="#4a4a4a"/></svg></button>
      <span class="sep"></span>
      <div id="tfBox" style="display:flex;gap:0;align-items:center"></div>
      <div class="grow"></div>
      <span id="tfHint" style="font:10px var(--ui);color:#666;padding-right:4px"></span>

    <!-- 工作区 -->

      <aside class="mw hide" id="mw">

        <div class="mw-list" id="mwList"></div>
        <div class="mw-foot"><span id="mwSpread">—</span><span id="mwTime">—</span></div>
      </aside>

      <div class="chartbox">
        <div class="chart-top" id="chartTop">
          <canvas id="chart"></canvas>
          <div class="symtab" id="symTab"><span class="tri"></span><span id="symText">AUDJPY</span></div>
          <div class="oneclick" id="oneclick">
            <div class="oc-top">
              <button class="oc-tab" id="ocSell" data-i18n="oc.sell"></button>
              <div class="oc-vol">
                <button class="oc-step" id="ocPrev">▲</button>
                <div class="oc-num" id="ocVol">15.00</div>
                <button class="oc-step" id="ocNext">▼</button>
              </div>
              <button class="oc-tab" id="ocBuy" data-i18n="oc.buy"></button>
            </div>
            <div class="oc-bot">
              <div class="oc-cell" id="ocBid" title="売り: クリックで売り成行"></div>
              <div class="oc-cell" id="ocAsk" title="買い: クリックで買い成行"></div>
            </div>
          </div>
        </div>
        <div class="hscroll"><div class="thumb" id="hthumb"></div><div class="corner"></div></div>
      </div>
    </div>

    <!-- 终端 -->
    <div class="term" id="term">
      <div class="term-tabs" id="termTabs">
        <button class="ttab on" data-pane="trade"><span data-i18n="term.trade"></span><span class="c" id="cTrade">0</span></button>
        <button class="ttab" data-pane="acct"><span data-i18n="term.acct"></span></button>
        <button class="ttab" data-pane="hist"><span data-i18n="term.hist"></span><span class="c" id="cHist">0</span></button>
        <button class="ttab" data-pane="news"><span data-i18n="term.news"></span><span class="c" id="cNews">0</span></button>

  function buildCandles() {
    const st = P[S.sym], T = st.ticks, g = TF[S.tf].g, n = T.length;
    if (!n) return [];
    const base = st.n - n;                       // ticks[0] 的全局序号
    const lastB = Math.floor((st.n - 1) / g);    // 当前桶号（绝对，不随窗口滑动）
    const out = [];
    for (let b = lastB; b >= 0 && out.length < 120; b--) {
      const from = b * g - base;
      const to = (b + 1) * g - 1 - base;
      if (to < 0 || from > n - 1) continue;
      const s = Math.max(0, from), e = Math.min(n - 1, to);
      let hi = -Infinity, lo = Infinity;
      for (let i = s; i <= e; i++) { if (T[i] > hi) hi = T[i]; if (T[i] < lo) lo = T[i]; }
      out.unshift({ o: T[s], c: T[e], h: hi, l: lo });

  /* ================= 交易 ================= */
  const now2 = () => { const d = new Date(); return d; };
  const hhmmss = () => { const d = now2(); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
  const dt = () => { const d = now2(); return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };

  function pushJournal(text) {
    journal.push({ t: dt(), m: text });
    if (journal.length > 200) journal.shift();
    renderJournal();
  }

  function account() {
    const pl = positions.reduce((s, p) => s + posPl(p) + p.swap, 0);
    const margin = positions.reduce((s, p) => s + (p.pending ? 0 : valueJpy(p.sym, mid(p.sym), p.vol) / ACC.lev), 0);
    const equity = ACC.balance + pl;
    return { pl, margin, equity, free: equity - margin, level: margin > 0 ? (equity / margin) * 100 : Infinity };
  }

  function execute(side, opts) {
    opts = opts || {};
    const sym = opts.sym || S.sym;
    const vol = opts.vol || S.vol;
    const type = opts.type || 'market';
    const cfg = P[sym].cfg, q = quote(sym);
    const a = account();
    const px = side === 'buy' ? q.ask : q.bid;
    const need = valueJpy(sym, px, vol) / ACC.lev;
    if (need > a.free) { pushJournal(t('toast.noMargin') + ' — ' + sym + ' ' + vol.toFixed(2)); flash('No money'); return false; }
    const id = ++seq;
    if (type !== 'market') {
      const req = +(opts.price || px).toFixed(cfg.dg);
      if ((type === 'limit' && ((side === 'buy' && req >= q.ask) || (side === 'sell' && req <= q.bid))) ||
        (type === 'stop' && ((side === 'buy' && req <= q.ask) || (side === 'sell' && req >= q.bid)))) {
        pushJournal((LANG === 'ja' ? '価格が不正です: ' : '价格无效：') + fmt(req, cfg.dg));
        flash(LANG === 'ja' ? '価格が不正です' : '价格无效');
        return false;
      }
      positions.push({
        id, sym, side, vol, price: 0, reqPrice: req, type, pending: true,
        time: dt(), swap: 0, sl: +(opts.sl || 0), tp: +(opts.tp || 0)
      });
      pushJournal(t('jrnl.pending', { s: sym, v: vol.toFixed(2), p: fmt(req, cfg.dg) }));
      renderTrade(); updateTermFoot(); flash((side === 'buy' ? '買 ' : '売 ') + vol.toFixed(2) + ' ' + fmt(req, cfg.dg));
      return true;
    }
    const p = {
      id, sym, side, vol, price: +px.toFixed(cfg.dg), time: dt(),
      swap: Math.round((Math.random() - 0.4) * 60 * vol), sl: 0, tp: 0
    };
    if (opts && opts.sl) p.sl = opts.sl;
    if (opts && opts.tp) p.tp = opts.tp;
    positions.push(p);
    pushJournal(t(side === 'buy' ? 'jrnl.buy' : 'jrnl.sell', { v: vol.toFixed(2), s: sym, p: fmt(px, cfg.dg) }) + '  sl: ' + (p.sl || 0) + '  tp: ' + (p.tp || 0));
    renderTrade(); updateTermFoot(); flash(side === 'buy' ? '買 ' + vol.toFixed(2) : '売 ' + vol.toFixed(2));
    return true;
  }

  function closePos(id) {
    const p = positions.find((x) => x.id === id); if (!p) return;
    if (p.pending) {
      positions = positions.filter((x) => x.id !== id);
      pushJournal(t('jrnl.cancel', { id: p.id }));
      renderTrade(); updateTermFoot(); return;
    }
    const q = quote(p.sym), cfg = P[p.sym].cfg;
    const px = p.side === 'buy' ? q.bid : q.ask;
    const pl = posPl(p) + p.swap;
    ACC.balance += pl;
    history.push({ time: p.time, sym: p.sym, side: p.side, vol: p.vol, price: p.price, close: +px.toFixed(cfg.dg), pl });
    positions = positions.filter((x) => x.id !== id);
    pushJournal(t('jrnl.close', { id: p.id, s: p.sym, v: p.vol.toFixed(2), p: (pl >= 0 ? '+' : '') + num2(pl) }));
    renderTrade(); renderHist(); updateTermFoot(); draw();
  }
  function closeAll() {
    if (!positions.length) return;
    positions.slice().forEach((p) => closePos(p.id));
  }

  function checkPending() {
    positions.slice().forEach((p) => {
      if (!p.pending) return;
      const q = quote(p.sym), cfg = P[p.sym].cfg;
      const hit = p.type === 'limit'
        ? (p.side === 'buy' ? q.ask <= p.reqPrice : q.bid >= p.reqPrice)
        : (p.side === 'buy' ? q.ask >= p.reqPrice : q.bid <= p.reqPrice);
      if (hit) {
        p.pending = false; p.price = +(p.reqPrice).toFixed(cfg.dg);
        pushJournal(t(p.side === 'buy' ? 'jrnl.buy' : 'jrnl.sell', { v: p.vol.toFixed(2), s: p.sym, p: fmt(p.price, cfg.dg) }));
        renderTrade(); updateTermFoot(); flash(t('toast.filled') + ' ' + p.sym + ' ' + fmt(p.price, cfg.dg));
      }
    });
  }

  function checkSLTP() {
    positions.slice().forEach((p) => {
      const q = quote(p.sym);
      const hitTp = p.tp && (p.side === 'sell' ? q.ask <= p.tp : q.bid >= p.tp);
      const hitSl = p.sl && (p.side === 'sell' ? q.ask >= p.sl : q.bid <= p.sl);
      if (hitTp || hitSl) closePos(p.id);
    });
  }
  function checkMargin() {
    const a = account();
    if (!isFinite(a.level)) { warned = false; return; }
    if (a.level < 200 && !warned) { warned = true; pushJournal(t('toast.marginWarn') + ' ' + a.level.toFixed(0) + '%'); flash(t('toast.marginWarn')); }
    if (a.level > 260) warned = false;
    if (a.level < 100 && positions.length && !locked) {
      locked = true; closeAll();
      pushJournal(t('jrnl.losscut', { r: '100' }));
      flash(t('toast.losscut'));
      setTimeout(() => { locked = false; }, 1500);
    }
  }

  function seedFeed() {

        tag: n.tag, pair: n.pair, dir: n.dir, ja: n.ja, zh: n.zh, fresh: false });
    }

  }
  function publishNews() {
    const n = NEWS_ITEMS[newsSeq % NEWS_ITEMS.length]; newsSeq++;
    const item = { time: nowHM(), tag: n.tag, pair: n.pair, dir: n.dir, ja: n.ja, zh: n.zh, fresh: true };
    feed.unshift(item); if (feed.length > 14) feed.pop();

    const st = P[n.pair], cfg = PAIRS.filter((x) => x.code === n.pair)[0];
    if (st && cfg && st.ticks.length) {

      st.ticks[st.ticks.length - 1] = last + n.dir * cfg.vol * (5 + Math.random() * 4);

      '<div style="margin-top:10px;font-size:11px;line-height:1.7;color:#444">' +
      (LANG === 'ja' ? '「FX戦士くるみちゃん」風の取引画面を再現した<br>非公式のデモ端末です。実際の取引は行いません。'
        : '复刻《FX战士久留美》交易界面的<br>非官方演示终端，不会进行真实交易。') +
      '</div></div>',
      [{ label: t('btn.ok'), cls: 'pri' }], 330);
  }
  function openHelpDlg() {
    const rows = LANG === 'ja'
      ? [['気配値', '左の一覧をクリックで通貨切替（表示メニューで表示）'],
      ['一键注文', 'チャート左上の SELL / BUY、または価格をクリック'],
      ['数量変更', '一键パネルの ▲ ▼ で 1.00 ロットずつ変更'],
      ['指値注文', 'ツールバー「新規注文」または Ctrl+N'],
      ['決済', '取引タブの行をダブルクリック、または「決済」ボタン'],
      ['言語切替', '右上「日本語 ⇄ 中文」ボタン']]
      : [['报价窗口', '在左侧列表点击切换货币对（视图菜单可显示）'],
      ['一键下单', '点击图表左上的 SELL / BUY，或点击价格'],
      ['修改手数', '一键面板的 ▲ ▼ 每次 1.00 手'],
      ['限价委托', '工具栏「新规订单」或 Ctrl+N'],
      ['平仓', '双击交易标签中的持仓行，或点「平仓」'],
      ['语言切换', '右上角「日本語 ⇄ 中文」按钮']];
    dlg(t('dlg.help'), rows.map((r) => '<div class="dinfo" style="margin-bottom:4px"><div><span>' + r[0] + '</span><b style="font-family:var(--ui);font-weight:400">' + r[1] + '</b></div></div>').join(''),
      [{ label: t('btn.ok'), cls: 'pri' }], 420);
  }

  /* ================= 面板开关 ================= */
  function toggleMW() {
    S.showMW = !S.showMW;
    $('#mw').classList.toggle('hide', !S.showMW);
    setTimeout(resize, 20);
  }
  function toggleTerm() {
    S.showTerm = !S.showTerm;
    $('#term').classList.toggle('small', !S.showTerm);
    setTimeout(resize, 20);
  }
  function toggleAuto() {
    S.auto = !S.auto;
    $('#sbAuto').textContent = S.auto ? 'ON' : 'OFF';
    $('#btnAuto').classList.toggle('on', S.auto);
    flash((LANG === 'ja' ? '自動売買 ' : '自动交易 ') + (S.auto ? 'ON' : 'OFF'));
  }

  /* ================= 语言 ================= */
  function applyI18n() {
    $$('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    const sb = document.getElementById('tbSearch');
    if (sb) sb.placeholder = LANG === 'ja' ? '検索' : '搜索';
    renderStart(); renderFeed(); updateBrwTicker(true); syncChrome();
    $$('[data-i18n-title]').forEach((el) => { el.title = t(el.dataset.i18nTitle); });
    $('#langLabel').textContent = LANG === 'ja' ? '中文' : '日本語';
    $('#langBtn').textContent = LANG === 'ja' ? '日本語 ⇄ 中文' : '中文 ⇄ 日本語';
    updateTitle();
  }
  function setLang(l) {
    if (LANG === l) return;
    LANG = l; document.documentElement.lang = l === 'ja' ? 'ja' : 'zh-CN';
    applyI18n(); buildMenus(); updateTermFoot(); renderTrade(); renderHist(); renderNews(); renderJournal();
    pushJournal(t('jrnl.lang', { l: l === 'ja' ? '日本語' : '中文' }));
  }
  $('#langBtn').addEventListener('click', () => setLang(LANG === 'ja' ? 'zh' : 'ja'));
  $('#btnLang2').addEventListener('click', () => setLang(LANG === 'ja' ? 'zh' : 'ja'));

  /* ================= 终端标签 ================= */
  function switchPane(name) {
    $$('.ttab').forEach((b) => b.classList.toggle('on', b.dataset.pane === name));
    $$('.pane').forEach((p) => { p.style.display = (p.id === 'pane-' + name) ? '' : 'none'; });
  }
  $$('.ttab[data-pane]').forEach((b) => b.addEventListener('click', () => switchPane(b.dataset.pane)));
  $('#termToggle').addEventListener('click', toggleTerm);

  /* ================= 工具栏动作 ================= */
  $('#btnNewOrder').addEventListener('click', openOrderDlg);
  $('#btnBuyArrow').addEventListener('click', () => { S_side('buy'); });
  $('#btnSellArrow').addEventListener('click', () => { S_side('sell'); });
  function S_side(side) { execute(side); }
  $('#btnMW').addEventListener('click', toggleMW);
  $('#btnAuto').addEventListener('click', toggleAuto);
  $('#btnCross').addEventListener('click', () => { S.showCross = !S.showCross; $('#btnCross').classList.toggle('on', S.showCross); draw(); });
  $('#symTab').addEventListener('click', () => { toggleMW(); if (S.showMW) flash(t('mw.title')); });

  /* ================= 窗口 ================= */
  $('#btnMin').addEventListener('click', () => { $('#app').classList.add('mini'); $('#taskApp').classList.add('off'); flash(t('toast.mini')); });
  $('#btnMax').addEventListener('click', () => toggleMax($('#app')));
  $('#btnClose').addEventListener('click', doLogout);
  function doLogout() {
    $('#app').classList.add('mini'); $('#taskApp').classList.add('off');
    flash(LANG === 'ja' ? 'ログアウトしました（タスクバーで復元）' : '已注销（点击任务栏恢复）');
  }
  $('#taskApp').addEventListener('click', () => {
    const a = $('#app');
    if (a.classList.contains('mini')) { a.classList.remove('mini'); $('#taskApp').classList.remove('off'); raise(a); setTimeout(resize, 60); }
    else { a.classList.add('mini'); $('#taskApp').classList.add('off'); }
  });
  $('#taskApp').classList.remove('off');
  setTimeout(openAcctDlg, 700);   // 启动时请求选择账户（同参考图）

  /* ================= 窗口管理：拖动 / 最大化 / 置顶 ================= */
  function makeDrag(win, bar) {
    let sx = 0, sy = 0, ox = 0, oy = 0, on = false;
    bar.addEventListener('mousedown', (e) => {
      if (e.target.closest('button') || win.classList.contains('maxed')) return;
      const r = win.getBoundingClientRect();
      on = true; sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
      win.style.left = ox + 'px'; win.style.top = oy + 'px';
      win.style.width = r.width + 'px'; win.style.height = r.height + 'px';
      raise(win);
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!on) return;
      const w = win.offsetWidth, vw = window.innerWidth, vh = window.innerHeight;
      win.style.left = clamp(ox + e.clientX - sx, -(w - 100), vw - 100) + 'px';   // 至少留 100px 在屏内
      win.style.top = clamp(oy + e.clientY - sy, 0, vh - 42 - 12) + 'px';        // 标题栏不许拖到任务栏下面
    });
    window.addEventListener('mouseup', () => { on = false; });
    bar.addEventListener('dblclick', (e) => { if (!e.target.closest('button')) toggleMax(win); });
  }
  function toggleMax(win) {
    if (win.classList.contains('maxed')) {
      win.classList.remove('maxed');
      if (win._geo) { win.style.left = win._geo.l; win.style.top = win._geo.t; win.style.width = win._geo.w; win.style.height = win._geo.h; }
    } else {
      const r = win.getBoundingClientRect();
      win._geo = { l: win.style.left || r.left + 'px', t: win.style.top || r.top + 'px',
                   w: win.style.width || r.width + 'px', h: win.style.height || r.height + 'px' };
      win.style.left = win.style.top = win.style.width = win.style.height = '';
      win.classList.add('maxed');
    }
    raise(win);
    setTimeout(resize, 120);
  }
  makeDrag($('#app'), $('#tbar'));
  makeDrag($('#brw'), $('#brwT'));
  [$('#app'), $('#brw')].forEach((w) => w.addEventListener('mousedown', () => raise(w), true));

  /* ================= 时钟 ================= */
  function clock() {
    const d = new Date();
    const s = d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    $('#sbClock').innerHTML = '<b>' + s + '</b>';
    const ot = $('#osTime');
    ot.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    ot.title = d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate());
    $('#sbLat').textContent = 12 + Math.floor(Math.random() * 14);
    if (S.showMW) $('#mwTime').textContent = hhmmss();
  }

  /* ================= 主循环 ================= */
  function loop() {
    tickMarket();
    S.candles = buildCandles();
    updateMW(); updateOneClick(); updateTradeLive(); updateTermFoot(); checkPending(); checkSLTP(); checkMargin(); draw();
    updateBrwTicker(false);
  }

  /* ================= 启动 ================= */
  function boot() {
    initMarket();
    S.candles = buildCandles();
    applyI18n();
    buildMenus();
    buildTF();
    buildMW();
    renderTrade(); renderHist(); renderNews();
    updateTermFoot(); updateOneClick(); updateTitle();
    pushJournal(t('jrnl.start'));
    pushJournal(t('jrnl.login'));
    pushJournal(t('toast.demo'));
    renderJournal();
    resize();
    window.KX = { S: S, P: P, pos: () => positions, acc: account, news: () => feed, publish: () => publishNews() };
    $('#startBtn').addEventListener('click', (e) => { e.stopPropagation(); smToggle(); });
    const smc = $('#smClose'); if (smc) smc.addEventListener('click', () => smToggle(false));
    syncChrome();
    seedFeed();
    setTimeout(() => brwOpen(true), 3200);          // 自动打开财经新闻浏览器
    setTimeout(() => publishNews(), 15000);         // 第一条新闻
    setInterval(loop, 700);
    setInterval(clock, 1000);
    clock();
  }
  boot();
})();

</script>
</body>
</html>
